<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b1640">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Knalkarts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap">
<link rel="stylesheet" href="style.css">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script type="importmap">{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>

<div id="menu" class="screen">
  <div class="card">
    <h1>KNAL<span>KARTS</span></h1>
    <p class="sub">Race tegen je vrienden, gewoon op je telefoon</p>
    <input id="name" maxlength="12" placeholder="Jouw naam" autocomplete="off">
    <div id="colors"></div>
    <button id="btnHost" class="big">🏁 Nieuwe race maken</button>
    <div class="row">
      <input id="code" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters">
      <button id="btnJoin" class="mid">Meedoen</button>
    </div>
    <button id="btnSolo" class="ghost">Alleen oefenen tegen de computer</button>
    <p id="menuMsg" class="msg"></p>
  </div>
</div>

<div id="lobby" class="screen hidden">
  <div class="card">
    <p class="sub">Racecode</p>
    <div id="roomCode" class="code">----</div>
    <button id="btnShare" class="ghost">📤 Stuur de link naar je vrienden</button>
    <ul id="players"></ul>
    <div id="hostOpts">
      <div class="row opts">
        <label>Rondes
          <select id="laps"><option>1</option><option>2</option><option selected>3</option><option>5</option></select>
        </label>
        <label><input type="checkbox" id="fillBots" checked> Computer-racers erbij</label>
      </div>
      <button id="btnStart" class="big">START!</button>
    </div>
    <p id="lobbyMsg" class="msg"></p>
    <p id="keysHint" class="hint">Toetsenbord: ←→ sturen · ↓ remmen · spatie driften · E item</p>
    <button id="btnLeave" class="ghost">Verlaten</button>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="pos">1<sup>e</sup></div>
  <div id="lap">Ronde 1/3</div>
  <div id="time">0:00.0</div>
  <div id="item"></div>
  <canvas id="minimap" width="140" height="140"></canvas>
  <div id="countdown"></div>
  <div id="toast"></div>
</div>

<div id="controls" class="hidden">
  <div id="steer"><span class="arr l">◀</span><span class="arr r">▶</span><div id="knob"></div></div>
  <button id="bBrake" class="ctl">REM</button>
  <button id="bItem" class="ctl">ITEM</button>
  <button id="bDrift" class="ctl">DRIFT</button>
</div>

<div id="results" class="screen hidden">
  <div class="card">
    <h2>Uitslag</h2>
    <ol id="resList"></ol>
    <button id="btnAgain" class="big">Nog een keer</button>
    <p id="resMsg" class="msg"></p>
    <button id="btnMenu" class="ghost">Terug naar menu</button>
  </div>
</div>

<div id="rotate">Draai je telefoon dwars voor meer overzicht ↻</div>
<button id="mute" aria-label="Geluid aan/uit">🔊</button>
<script type="module" src="game.js"></script>
</body>
</html>
